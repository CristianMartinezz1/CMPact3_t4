spring.application.name=cmpact3_t4
# Actividad 3: puerto nuevo (Actividad 1 = 8081, Actividad 2 = 8082)
server.port=8083

app.nombre-proyecto=CMPact3_t4 - CRUD de Alumnos y Carreras

# Base de datos MySQL.
# Los valores reales se pasan con variables de entorno (DB_URL, DB_USER, DB_PASSWORD);
# lo que va despues de ":" es solo el valor por defecto para pruebas en local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cmpact3_t4?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:cmpact3}
spring.datasource.password=${DB_PASSWORD:cmpact3_local}

# JPA crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# Respeta el prefijo /act3-t4 cuando el proyecto se sirve detras de nginx
server.forward-headers-strategy=framework

# La sesion (mensajes despues de guardar) solo por cookie, sin ;jsessionid en la URL
server.servlet.session.tracking-modes=cookie
